# Re-check periodically: prices change and models get retired.
models:
  gemini-2.5-pro:
    input: 1.25
    output: 10.00
  gemini-2.5-flash:
    input: 0.30
    output: 2.50
  # Promotional price through 2026-12-31; becomes input 1.50 / output 7.50 from 2027-01-01.
  gemini-3.8-flash:
    input: 0.75
    output: 3.75
  # Flagship. Not on the free tier. Doubles on 2026-12-01 (input 4.00 / output 20.00).
  gemini-4-argon:
    input: 2.00
    output: 10.00
  gemini-3.1-pro-preview:
    input: 2.00
    output: 12.00
